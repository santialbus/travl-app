name: travl
description: Collaborative trip planning app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Google Sign In
  google_sign_in: ^6.2.2

  # Apple Sign In
  sign_in_with_apple: ^6.1.3

  # Navigation
  go_router: ^14.6.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.1
  flutter_animate: ^4.5.0
  flutter_native_splash: ^2.4.1
  http: ^1.2.1 # para llamar a Nominatim
  map_launcher: ^3.4.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  riverpod_lint: ^2.6.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  firebase_app_check: ^0.3.2
  shared_preferences: ^2.3.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
      - assets/logo/logotravl.png

  # assets:
  #   - assets/images/
  #   - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logotravl.png"
  min_sdk_android: 21